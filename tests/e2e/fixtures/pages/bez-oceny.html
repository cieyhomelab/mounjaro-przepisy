<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Zupa krem z dyni – Smaczne Testy</title>
    <meta property="og:site_name" content="Smaczne Testy" />
    <meta property="og:image" content="/img/danie.png" />
  </head>
  <body>
    <article itemscope itemtype="https://schema.org/Recipe">
      <h1 itemprop="name">Zupa krem z dyni</h1>
      <img itemprop="image" src="/img/danie.png" alt="" />
      <p>Porcje: <span itemprop="recipeYield">3 porcje</span></p>
      <ul>
        <li itemprop="recipeIngredient">600 g dyni</li>
        <li itemprop="recipeIngredient">1 cebula</li>
        <li itemprop="recipeIngredient">500 ml bulionu warzywnego</li>
      </ul>
      <ol itemprop="recipeInstructions">
        <li>Podsmaż cebulę i dynię.</li>
        <li>Zalej bulionem i gotuj 20 minut.</li>
        <li>Zblenduj na gładki krem.</li>
      </ol>
    </article>
  </body>
</html>
