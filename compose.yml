# Production-like stack: the app (API + built client) and PostgreSQL.
# Usage: cp .env.example .env, fill in the required values, docker compose up -d --build
name: mounjaro-przepisy

services:
  app:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-google}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-}
      FETCH_ALLOW_PRIVATE_NETWORK: ${FETCH_ALLOW_PRIVATE_NETWORK:-}
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    restart: unless-stopped

  # Encrypted database backups every 6 hours (docs/operations.md). BACKUP_AGE_RECIPIENT is the
  # public age key; without it the service stops with an error and no backup is made.
  backup:
    build:
      context: backup
    environment:
      PGHOST: db
      PGUSER: app
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS in front of the app with an automatic certificate. Optional: start it with
  # `docker compose --profile tls up -d` when the server has no reverse proxy of its own.
  caddy:
    image: caddy:2-alpine
    profiles:
      - tls
    # APP_DOMAIN must be set in .env (an empty value makes caddy stop with an error at start).
    command: caddy reverse-proxy --from ${APP_DOMAIN:-} --to app:3000
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
