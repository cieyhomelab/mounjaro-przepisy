# Production-like stack: the app (API + built client) and PostgreSQL.
# Usage: cp .env.example .env, fill in the required values, docker compose up -d --build
name: mounjaro-przepisy

services:
  app:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
