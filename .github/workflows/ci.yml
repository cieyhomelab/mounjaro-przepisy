name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit, integration, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Lint and type check
        run: scripts/lint.sh
      - name: Unit tests
        run: scripts/test-unit.sh
      - name: Integration tests
        run: scripts/test-integration.sh
      - name: Build
        run: scripts/build.sh

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: E2E tests
        run: scripts/test-e2e.sh
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
