# Override used only by scripts/test-e2e.sh (together with compose.yml).
# No host ports are published; the Playwright runner shares the app's network
# namespace, so tests reach the app at http://localhost:3000. localhost is a
# secure context, which service workers and Web Push require.
services:
  app:
    environment:
      APP_ENV: e2e
      AUTH_MODE: mock
      APP_BASE_URL: http://localhost:3000
      ALLOWED_EMAIL: owner@example.test
      # Recipe pages come from the "fixtures" service on the private Compose network.
      FETCH_ALLOW_PRIVATE_NETWORK: 'true'
      FETCH_TIMEOUT_MS: '3000'
    ports: !reset []
    restart: 'no'

  db:
    restart: 'no'

  # Test pages standing in for recipe sites; reachable as http://fixtures.test:8080.
  fixtures:
    build:
      context: .
      target: fixtures
    networks:
      default:
        aliases:
          - fixtures.test
    restart: 'no'

  e2e:
    build:
      context: .
      target: e2e
    network_mode: service:app
    environment:
      E2E_BASE_URL: http://localhost:3000
      CI: ${CI:-}
    depends_on:
      app:
        condition: service_healthy
      fixtures:
        condition: service_started
    profiles:
      - runner
